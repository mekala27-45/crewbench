name: Build provisional evidence report
on:
  push:
    branches: [main, codex/crewbench-completion]
    paths: [evaluation/report-request.json]
permissions:
  contents: write
jobs:
  report:
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    env:
      SOURCE_COMMIT: ${{ github.sha }}
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683
        with:
          persist-credentials: false
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020
        with:
          node-version: 24.19.0
      - run: npm ci
      - run: npm test
      - run: python3 -m unittest discover -s tests -p 'test_*.py'
      - run: node scripts/freeze.ts --verify
      - name: Import exact sealed execution evidence
        env:
          GH_TOKEN: ${{ github.token }}
        run: node scripts/import-report.ts
      - name: Grade public records without private answer-key claims
        run: |
          python3 evaluation/grade.py artifacts/baseline/postgres.json artifacts/baseline/postgres-grades.json --public-records
          python3 evaluation/grade.py artifacts/actual/results.json artifacts/actual/grades.json --public-records
          python3 evaluation/statistics.py artifacts/actual/results.json artifacts/actual/grades.json artifacts/actual/summary.json
          python3 evaluation/recovery.py artifacts/recovery/results.json artifacts/recovery/grades.json
          node scripts/build-report.ts
      - name: Validate report rendering and static build
        run: npx vite build
      - name: Preserve provisional report and failures
        if: always()
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          mkdir -p artifacts/report
          python3 -c 'import os,json,pathlib; pathlib.Path("artifacts/report/workflow.json").write_text(json.dumps({"source_commit":os.environ["GITHUB_SHA"],"run_id":os.environ["GITHUB_RUN_ID"],"private_truth_verified":False,"summary_present":pathlib.Path("artifacts/actual/summary.json").exists()}))'
          git config user.name 'Ajay Mekala'
          git config user.email 'mekalaajayk@gmail.com'
          git switch -c results/report-${GITHUB_RUN_ID}
          git add artifacts site/public/data
          git commit -m 'test: retain provisional grades with exact execution provenance'
          gh auth setup-git
          git push origin HEAD
