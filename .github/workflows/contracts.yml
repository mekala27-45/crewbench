name: Contract and evidence gates
on:
  push:
    branches: [main, codex/crewbench-completion]
    paths: [src/**, agent/**, tests/**, scripts/**, evaluation/**, .agents/**, docs/**, AGENTS.md, CLAUDE.md, .github/workflows/contracts.yml]
permissions:
  contents: read
jobs:
  contracts:
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683
        with:
          persist-credentials: false
      - uses: actions/setup-node@v4
        with:
          node-version: 24.19.0
      - run: npm ci
      - run: npm test
      - run: python3 -m unittest discover -s tests -p 'test_*.py'
      - name: Generated instructions match authored inputs
        run: |
          node scripts/generate-agents.mjs
          git diff --exit-code -- agent
