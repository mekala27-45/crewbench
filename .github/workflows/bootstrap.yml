name: Bootstrap probes
on:
  push:
    branches: [main]
    paths: [scripts/probe-environment.mjs, .github/workflows/bootstrap.yml]
  workflow_dispatch:
permissions:
  contents: write
concurrency:
  group: crewbench-bootstrap
  cancel-in-progress: false
jobs:
  probe:
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683
        with:
          persist-credentials: false
      - uses: actions/setup-node@v4
        with:
          node-version: 24.19.0
      - name: Run package and environment probes
        run: node scripts/probe-environment.mjs
      - name: Preserve probe evidence
        if: always()
        env:
          GH_TOKEN: ${{ github.token }}
          SOURCE_SHA: ${{ github.sha }}
        run: |
          set -eu
          git config user.name 'Ajay Mekala'
          git config user.email 'mekalaajayk@gmail.com'
          git switch -c results/bootstrap-${GITHUB_RUN_ID}
          mkdir -p artifacts/probes
          printf '%s\n' "$SOURCE_SHA" > artifacts/probes/source-commit.txt
          git add artifacts/probes
          git commit -m 'chore: preserve dependency and environment probes'
          gh auth setup-git
          git push origin HEAD
