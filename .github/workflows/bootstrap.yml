name: Bootstrap probes
on:
  push:
    branches: [main]
    paths: [scripts/probe-environment.mjs, .github/workflows/bootstrap.yml]
  workflow_dispatch:
permissions:
  contents: write
concurrency:
  group: crewbench-bootstrap
  cancel-in-progress: false
jobs:
  probe:
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683
        with:
          persist-credentials: false
      - uses: actions/setup-node@v4
        with:
          node-version: 24.19.0
      - name: Run package and environment probes
        run: node scripts/probe-environment.mjs
      - name: Install verified candidates and retain matching documentation
        run: |
          npm install --save-exact eve@1.0.0-rc.5 ai@7.0.163 @ai-sdk/openai-compatible@3.0.85 pg@8.23.1 zod@4.6.7
          npm install --save-dev --save-exact vite@8.3.6 typescript@6.0.3 @types/node@24 @playwright/test@1.64.1 @fontsource/faustina@5.3.0 @fontsource/sarabun@5.3.0 @fontsource/sono@5.3.0
          mkdir -p artifacts/probes/eve-docs
          cp -R node_modules/eve/docs/. artifacts/probes/eve-docs/
          cp package-lock.json artifacts/probes/verified-package-lock.json
          cp package.json artifacts/probes/verified-package.json
          node -e "const fs=require('fs');fs.writeFileSync('artifacts/probes/eve-exports.json',JSON.stringify(JSON.parse(fs.readFileSync('node_modules/eve/package.json')).exports,null,2))"
          find node_modules/eve/docs -type f | sort > artifacts/probes/eve-doc-index.txt
      - name: Preserve probe evidence
        if: always()
        env:
          GH_TOKEN: ${{ github.token }}
          SOURCE_SHA: ${{ github.sha }}
        run: |
          set -eu
          git config user.name 'Ajay Mekala'
          git config user.email 'mekalaajayk@gmail.com'
          git switch -c results/bootstrap-${GITHUB_RUN_ID}
          mkdir -p artifacts/probes
          printf '%s\n' "$SOURCE_SHA" > artifacts/probes/source-commit.txt
          git add artifacts/probes
          git commit -m 'chore: preserve dependency and environment probes'
          gh auth setup-git
          git push origin HEAD
