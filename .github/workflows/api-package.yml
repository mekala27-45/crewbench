name: Native API package verification
on:
  push:
    branches: [main]
    paths: [scripts/inspect-host.mjs, tsconfig.json, server.ts, src/api/**, vercel.json, package.json, package-lock.json, .github/workflows/api-package.yml]
permissions:
  contents: write
jobs:
  package:
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683
        with:
          persist-credentials: false
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020
        with:
          node-version: 24.19.0
      - name: Prepare offline host metadata without credentials
        run: |
          mkdir -p .vercel artifacts/host
          node -e 'const fs=require("fs");fs.writeFileSync(".vercel/project.json",JSON.stringify({projectId:"prj_QjxSIUWElOIEPoiEdWj4CEsVM6xa",orgId:"team_NNcxgB3J9dHQnUJYJJYvRMda",projectName:"crewbench-api",settings:{framework:"node",nodeVersion:"24.x",installCommand:"npm ci",buildCommand:null,devCommand:null,outputDirectory:null,rootDirectory:null}}));fs.writeFileSync(".vercel/.env.production.local","SOURCE_COMMIT="+process.env.GITHUB_SHA+"\n")'
      - name: Build native function without deployment
        run: |
          set -o pipefail
          npx --yes vercel@65.11.0 build --prod --yes 2>&1 | tee artifacts/host/build.log
      - name: Inspect packaged public inputs and runtime exclusions
        run: node scripts/inspect-host.mjs
      - name: Preserve build evidence
        if: always()
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          mkdir -p artifacts/host
          python3 -c 'import os,json,pathlib; pathlib.Path("artifacts/host/workflow.json").write_text(json.dumps({"source_commit":os.environ["GITHUB_SHA"],"run_id":os.environ["GITHUB_RUN_ID"],"deployed":False}))'
          git config user.name 'Ajay Mekala'
          git config user.email 'mekalaajayk@gmail.com'
          git switch -c results/host-${GITHUB_RUN_ID}
          git add artifacts/host
          git add -f artifacts/host/*.log || true
          git commit -m 'test: retain native host packaging evidence without deployment'
          gh auth setup-git
          git push origin HEAD
